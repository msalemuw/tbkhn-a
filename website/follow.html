<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>tabkheen A on Instagram</title>
<meta name="theme-color" content="#28303a">
<link rel="icon" href="/favicon.png">
<style>
  :root { --navy:#28303a; --white:#fff; --blue:#cae7f1; --teal:#00c2a8; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px; background:var(--navy); color:var(--white); font-family:-apple-system,system-ui,'Segoe UI',sans-serif; text-align:center; }
  main { max-width:380px; width:100%; }
  img { width:96px; height:auto; margin-bottom:18px; }
  p { margin:0 0 22px; color:var(--blue); line-height:1.5; }
  a.btn { display:block; padding:14px 18px; border-radius:999px; font-weight:700; text-decoration:none; background:var(--teal); color:var(--navy); }
</style>
</head>
<body>
<main>
  <img src="/logo.png" alt="tabkheen A">
  <p>Opening Instagram… · بنفتحلك إنستجرام</p>
  <a class="btn" id="go" href="https://www.instagram.com/tabkheen.a">@tabkheen.a</a>
</main>
<script src="/config.js"></script>
<script>
  // The QR code for the Instagram page lands here: count the scan in the same table as the sign-up funnel, then go to Instagram.
  (function () {
    var CFG = window.TABKHEEN || {};
    var target = (CFG.social && CFG.social.instagram) || 'https://www.instagram.com/tabkheen.a';
    document.getElementById('go').href = target;
    var q = new URLSearchParams(location.search), tags = {};
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'placement'].forEach(function (k) { if (q.get(k)) tags[k] = q.get(k); });
    var done = false;
    function go() { if (!done) { done = true; location.replace(target); } }
    setTimeout(go, 1200);
    if (!CFG.supabaseUrl) return go();
    try {
      fetch(CFG.supabaseUrl + '/rest/v1/signup_events', {
        method: 'POST', keepalive: true,
        headers: { apikey: CFG.supabaseKey, Authorization: 'Bearer ' + CFG.supabaseKey, 'Content-Type': 'application/json', Prefer: 'return=minimal' },
        body: JSON.stringify({
          session_id: Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10), user_ref: null, step: 'qr_scan_instagram',
          props: Object.assign({ via: 'web', code: 'ig' }, tags), app_version: 'web',
          os: 'web ' + (/iPhone|iPad/.test(navigator.userAgent) ? 'ios' : /Android/.test(navigator.userAgent) ? 'android' : 'desktop'),
          locale: navigator.language || null
        })
      }).then(go, go);
    } catch (e) { go(); }
  })();
</script>
</body>
</html>
