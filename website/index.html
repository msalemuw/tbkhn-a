<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tabkheen A · طابخين إيه</title>
<meta name="description" content="Home-cooked dishes from people you trust in your community. Pickup only, no delivery fees. Create your account now and be ready on launch day.">
<meta property="og:title" content="tabkheen A · طابخين إيه">
<meta property="og:description" content="أطباق بيتي من ناس تعرفهم في مجتمعك. اعمل حسابك دلوقتي وأول ما التطبيق ينزل ادخل على طول.">
<meta property="og:image" content="art.jpg">
<meta name="theme-color" content="#28303a">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
  /* The tabkheen A palette (founder, 2026-10-04): only these five colors, plus see-through tints. */
  :root {
    --navy: #28303a; --yellow: #ffc107; --white: #ffffff; --light-blue: #cae7f1; --teal: #00c2a8;
    --muted: rgba(40,48,58,0.68); --faint: rgba(40,48,58,0.4); --on-navy-muted: rgba(255,255,255,0.78);
    --sans: 'Hanken Grotesk', 'IBM Plex Sans Arabic', system-ui, sans-serif;
    --serif: 'Instrument Serif', Georgia, serif;
  }
  html[lang="ar"] { --sans: 'IBM Plex Sans Arabic', 'Hanken Grotesk', system-ui, sans-serif; --serif: 'IBM Plex Sans Arabic', serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--navy); color: var(--white); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  .hero { position: relative; background: var(--navy) url(art.jpg) center top / cover no-repeat; }
  .hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(40,48,58,0.35), rgba(40,48,58,0.92) 70%, var(--navy)); }
  .wrap { position: relative; z-index: 1; max-width: 480px; margin: 0 auto; padding: 16px 16px 32px; }
  .top { display: flex; justify-content: flex-end; }
  .lang { display: inline-flex; border: 1.5px solid rgba(255,255,255,0.4); border-radius: 999px; padding: 3px; }
  .lang button { border: 0; background: none; color: var(--white); font: 600 15px var(--sans); padding: 6px 14px; border-radius: 999px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--white); color: var(--navy); }
  .brand { display: flex; align-items: center; gap: 14px; margin-top: 48px; }
  .brand img { height: 36px; width: auto; }
  .brand .bar { width: 1.5px; height: 34px; background: rgba(255,255,255,0.4); }
  .brand .ar { font: 600 34px 'IBM Plex Sans Arabic', sans-serif; }
  h1 { font: 400 40px/1.08 var(--serif); margin: 20px 0 14px; }
  h1 b { color: var(--yellow); font-weight: inherit; }
  .early { display: block; width: 100%; margin-top: 28px; border: 0; border-radius: 18px; background: var(--yellow); color: var(--navy);
    font: 800 21px var(--sans); padding: 18px 16px; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  /* Phone showing the app's welcome screen, with "launching soon" under it. */
  .soon { margin: 26px 0 26px; text-align: center; }
  .phone { position: relative; width: min(270px, 72vw); aspect-ratio: 9 / 19.5; margin: 0 auto; border-radius: 46px;
    padding: 10px; background: var(--navy); box-shadow: 0 0 0 2px var(--light-blue), 0 24px 60px rgba(0,0,0,0.45); }
  .phone .screen { position: relative; height: 100%; border-radius: 37px; overflow: hidden;
    background: var(--navy) url(art.jpg) center top / cover no-repeat; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .phone .screen::before { content: ''; position: absolute; inset: 0; background: linear-gradient(rgba(40,48,58,0.25), rgba(40,48,58,0.9) 55%, var(--navy)); }
  .phone .island { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 34%; height: 24px; border-radius: 999px; background: var(--navy); z-index: 1; }
  .phone .logo { position: relative; width: 74%; height: auto; margin-top: 10%; }
  .phone .ar { position: relative; font: 600 26px 'IBM Plex Sans Arabic', sans-serif; margin-top: 10px; }
  .phone .tag { position: relative; font: 600 13px var(--sans); margin-top: 14px; padding: 0 16px; }
  .phone .tag b { color: var(--yellow); }
  .phone .bottom { position: absolute; left: 0; right: 0; bottom: 7%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 12px; }
  .phone .soonline { font: 700 19px var(--sans); text-align: center; }
  .phone .soonline span { color: var(--yellow); }
  .stores { display: flex; justify-content: center; gap: 8px; direction: ltr; }
  .stores span { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--white); border-radius: 10px; padding: 7px 10px; font: 700 13px var(--sans); direction: ltr; white-space: nowrap; background: var(--navy); }
  .stores svg { width: 16px; height: 16px; fill: var(--white); }
  html[lang="ar"] h1 { font-weight: 600; font-size: 34px; line-height: 1.35; }
  .lead { color: var(--on-navy-muted); font-size: 17px; line-height: 1.55; margin: 0 0 10px; }
  .pitch { font-weight: 600; font-size: 17px; line-height: 1.55; margin: 0; }
  .card { background: var(--white); color: var(--navy); border-radius: 22px; padding: 22px 18px; margin-top: 26px; }
  .card h2 { font: 700 22px var(--sans); margin: 0 0 4px; }
  .card .sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; line-height: 1.5; }
  .gbtn { display: flex; justify-content: center; min-height: 44px; margin-top: 6px; }
  .abtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 360px; min-height: 44px; margin: 10px auto 0;
          border: 0; border-radius: 999px; background: var(--navy); color: var(--white); font: 600 15px/1 'Hanken Grotesk', system-ui, sans-serif; cursor: pointer; direction: ltr; }
  .abtn svg { width: 18px; height: 18px; fill: currentColor; }
  .abtn[disabled] { opacity: .6; cursor: default; }
  .note { display: flex; gap: 10px; align-items: flex-start; background: rgba(202,231,241,0.45); border-radius: 14px; padding: 12px; font-size: 14px; line-height: 1.5; margin-top: 16px; }
  .note b { font-weight: 700; }
  h3.sec { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; margin: 26px 0 2px; }
  html[lang="ar"] h3.sec { letter-spacing: 0; font-size: 15px; }
  .secsub { color: var(--muted); font-size: 14px; line-height: 1.5; margin: 0; }
  label.f { display: block; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); margin: 16px 0 6px; }
  html[lang="ar"] label.f { letter-spacing: 0; font-size: 14px; }
  label.f .req { color: var(--faint); }
  input[type=text], input[type=tel], select {
    width: 100%; font: 500 17px var(--sans); color: var(--navy); background: var(--white);
    border: 1.5px solid var(--light-blue); border-radius: 14px; padding: 13px 14px; outline: none; appearance: none;
  }
  input[readonly] { background: rgba(202,231,241,0.3); }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--navy) 50%), linear-gradient(135deg, var(--navy) 50%, transparent 50%);
    background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%; background-size: 6px 6px; background-repeat: no-repeat; }
  html[dir="rtl"] select { background-position: 20px 55%, 26px 55%; }
  input:focus, select:focus { border-color: var(--teal); }
  input.ok { border-color: var(--teal); }
  .ltr { display: flex; gap: 8px; direction: ltr; }
  .ltr .pre { flex: 0 0 auto; display: flex; align-items: center; padding: 0 14px; border: 1.5px solid var(--light-blue); border-radius: 14px; font-weight: 600; }
  .ltr input { direction: ltr; text-align: left; }
  .hint { font-size: 13.5px; color: var(--muted); margin: 6px 2px 0; line-height: 1.45; }
  .hint.bad { color: var(--navy); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; direction: ltr; }
  .chips button { border: 1.5px solid var(--navy); background: none; color: var(--navy); border-radius: 999px; padding: 6px 12px; font: 600 14px var(--sans); cursor: pointer; }
  .loves { display: grid; gap: 8px; margin-top: 10px; }
  .loves button { border: 1.5px solid var(--light-blue); background: var(--white); color: var(--navy); border-radius: 14px; padding: 13px 14px; font: 600 16px var(--sans); text-align: start; cursor: pointer; }
  .loves button[aria-pressed="true"] { background: var(--teal); border-color: var(--teal); }
  .check { display: flex; gap: 10px; align-items: flex-start; margin-top: 22px; font-size: 15px; line-height: 1.45; }
  .check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--teal); flex: 0 0 auto; }
  .check a { color: var(--navy); }
  .err { color: var(--navy); background: rgba(255,193,7,0.25); border-radius: 10px; padding: 8px 10px; font-size: 14px; margin-top: 12px; display: none; }
  .err.show { display: block; }
  .cta { width: 100%; margin-top: 20px; border: 0; border-radius: 16px; background: var(--teal); color: var(--navy); font: 700 18px var(--sans); padding: 17px; cursor: pointer; }
  .cta:disabled { opacity: 0.6; cursor: default; }
  .ghost { width: 100%; margin-top: 10px; border: 1.5px solid var(--navy); border-radius: 16px; background: none; color: var(--navy); font: 600 16px var(--sans); padding: 14px; cursor: pointer; }
  .textlink { background: none; border: 0; color: var(--muted); font: 500 14px var(--sans); text-decoration: underline; cursor: pointer; padding: 0; margin-top: 16px; }
  .done { text-align: center; }
  .done .tick { width: 64px; height: 64px; border-radius: 50%; background: var(--teal); margin: 6px auto 14px; display: grid; place-items: center; }
  .done .note { text-align: start; }
  footer { max-width: 480px; margin: 0 auto; padding: 8px 16px 40px; color: var(--on-navy-muted); font-size: 14px; }
  footer a { color: var(--white); }
  footer p { margin: 0 0 10px; }
  #social { text-align: center; margin: 4px 0 26px; }
  #social p { font: 700 16px var(--sans); color: var(--white); }
  #social .icons { display: flex; justify-content: center; gap: 14px; }
  #social a { width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--white); display: grid; place-items: center; }
  #social a:hover { background: var(--teal); border-color: var(--teal); }
  #social svg { width: 24px; height: 24px; fill: var(--white); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="hero">
  <div class="wrap">
    <div class="top">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ar">ع</button>
      </div>
    </div>
    <button type="button" class="early" id="earlyBtn" data-t="earlyBtn"></button>

    <div class="soon">
      <div class="phone">
        <div class="screen">
          <span class="island" aria-hidden="true"></span>
          <img class="logo" src="logo.png" alt="tabkheen A">
          <span class="ar">طابخين إيه</span>
          <span class="tag" data-t="headline"></span>
          <div class="bottom">
          <span class="soonline" data-t="soonTitle"></span>
          <div class="stores">
            <span><svg viewBox="0 0 24 24"><path d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.9-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.4 1.2 9.8.8 1.2 1.8 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8s1.9.8 3.2.8c1.3 0 2.1-1.2 2.9-2.4.9-1.4 1.3-2.7 1.3-2.8-.1 0-2.4-.9-2.4-3.9zM14 5.5c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"/></svg>App Store</span>
            <span><svg viewBox="0 0 24 24"><path d="M3.6 2.3c-.2.2-.3.6-.3 1v17.4c0 .4.1.8.3 1l9.7-9.7L3.6 2.3zm10.7 8.7 2.9-2.9L5.4 1.4c-.3-.2-.7-.2-1 0l9.9 9.6zm0 2-9.9 9.6c.3.2.7.2 1 0l11.8-6.7-2.9-2.9zm6.8-2.4-3-1.7-3.1 3.1 3.1 3.1 3-1.7c.8-.5.8-1.6 0-2.8z"/></svg>Google Play</span>
          </div>
          </div>
        </div>
      </div>
    </div>
    <p class="lead" data-t="lead"></p>
    <p class="pitch" data-t="pitch"></p>

    <!-- Step 1: sign in with Google or Apple, the same account the app uses -->
    <div class="card" id="stepStart">
      <h2 data-t="startTitle"></h2>
      <p class="sub" data-t="startSub"></p>
      <div class="gbtn" id="gbtn"></div>
      <button type="button" class="abtn" id="abtn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.4 12.6c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2-.9-3.4-.9-1.7 0-3.3 1-4.2 2.6-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.6 1.3-.1 1.8-.8 3.3-.8 1.6 0 2 .8 3.4.8 1.4 0 2.3-1.3 3.1-2.5 1-1.4 1.4-2.8 1.4-2.9 0 0-2.7-1-2.7-4.1zM13.9 5c.7-.9 1.2-2 1-3.2-1 0-2.3.7-3 1.6-.7.8-1.2 2-1.1 3.1 1.2.1 2.3-.6 3.1-1.5z"/></svg>Continue with Apple</button>
      <div class="note"><span>ⓘ</span><span data-t="startNote"></span></div>
      <div class="err" id="errStart" role="alert"></div>
    </div>

    <!-- Step 2: the app's "Create your account" profile step -->
    <div class="card" id="stepProfile" hidden>
      <h2 data-t="profileTitle"></h2>
      <p class="sub" id="signedInAs"></p>
      <form id="form" novalidate>
        <label class="f" for="name"><span data-t="fName"></span> <span class="req">*</span></label>
        <input id="name" type="text" autocomplete="name" maxlength="60">

        <label class="f" for="username"><span data-t="fUsername"></span> <span class="req">*</span></label>
        <div class="ltr"><span class="pre">@</span><input id="username" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="20" placeholder="nour.s"></div>
        <p class="hint" id="usernameHint"></p>
        <div class="chips" id="usernameChips"></div>

        <label class="f" for="whatsapp"><span data-t="fWhatsapp"></span> <span class="req">*</span></label>
        <div class="ltr"><span class="pre">+20</span><input id="whatsapp" type="tel" inputmode="numeric" autocomplete="tel-national" placeholder="10 1234 5678" maxlength="14"></div>
        <p class="hint" data-t="whatsappHint"></p>

        <h3 class="sec"><span data-t="secAbout"></span> <span class="req">*</span></h3>
        <div class="loves" id="loves">
          <button type="button" data-loves="cooking" data-t="lovesCooking"></button>
          <button type="button" data-loves="eating" data-t="lovesEating"></button>
          <button type="button" data-loves="both" data-t="lovesBoth"></button>
        </div>

        <h3 class="sec"><span data-t="secCommunities"></span> <span class="req">*</span></h3>
        <p class="secsub" data-t="secCommunitiesSub"></p>

        <label class="f" for="gov"><span data-t="fGov"></span> <span class="req">*</span></label>
        <select id="gov"></select>

        <label class="f" for="area"><span data-t="fArea"></span> <span class="req">*</span></label>
        <select id="area"></select>
        <div id="areaTypedBox" hidden>
          <input id="areaTyped" type="text" maxlength="80" style="margin-top:8px">
          <p class="hint" data-t="areaTypedHint"></p>
        </div>

        <div id="optional"></div>
        <p class="hint" data-t="moreLater"></p>

        <h3 class="sec" data-t="secPaid"></h3>
        <label class="f" for="instapay" data-t="fInstapay"></label>
        <div class="ltr"><input id="instapay" type="text" autocapitalize="none" autocorrect="off" maxlength="60" placeholder="nour@instapay"></div>
        <p class="hint" data-t="instapayHint"></p>

        <h3 class="sec" data-t="secHeard"></h3>
        <label class="f" for="heard" data-t="fHeard"></label>
        <select id="heard"></select>
        <div id="heardPickBox" hidden>
          <label class="f" for="heardPick" data-t="fWhichOne"></label>
          <select id="heardPick"></select>
        </div>
        <div id="heardTextBox" hidden>
          <label class="f" for="heardText" id="heardTextLabel"></label>
          <input id="heardText" type="text" maxlength="80">
        </div>
        <div id="inviterBox" hidden>
          <label class="f" for="inviter" data-t="fInviter"></label>
          <input id="inviter" type="text" maxlength="60">
        </div>

        <label class="check"><input id="consent" type="checkbox"><span data-t="consent"></span></label>
        <div class="err" id="err" role="alert"></div>
        <button class="cta" id="submit" type="submit" data-t="submit"></button>
      </form>
      <button class="textlink" type="button" data-signout data-t="notYou"></button>
    </div>

    <!-- Step 3: done -->
    <div class="card done" id="stepDone" hidden>
      <div class="tick"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#28303a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2 id="doneTitle"></h2>
      <p class="sub" data-t="doneSub"></p>
      <div class="note"><span>ⓘ</span><span id="doneNote"></span></div>
      <button class="cta" id="share" type="button" data-t="share"></button>
      <button class="ghost" id="copy" type="button" data-t="copy"></button>
      <p class="hint" data-t="shareHint" style="text-align:center"></p>
      <button class="textlink" type="button" data-signout data-t="signOut"></button>
    </div>

  </div>
</div>
<footer>
  <div id="social" hidden><p data-t="follow"></p><div class="icons" id="socialIcons"></div></div>
  <a href="privacy.html" id="privacyLink" data-t="privacy"></a> · <span data-t="contact"></span> <a id="contactEmail"></a>
</footer>

<script>
(function () {

    }).then(function () { btn.disabled = false; });
  });
  // The button used on this device wins; one account can have both Google and Apple linked by the same email.
  function providerName() {
    var p = store('tabkheen.method') || (state.user && state.user.app_metadata && state.user.app_metadata.provider);
    return p === 'apple' ? 'Apple' : 'Google';
  }

  function afterSignIn(user) {
    state.user = user;
    return sb.rpc('my_profile').then(function (res) {
      state.profile = res.data || null;
      if (state.profile && state.profile.username) { state.step = 'done'; render(); return; }
      state.step = 'profile';
      var meta = user.user_metadata || {};
      if (!$('name').value) $('name').value = (state.profile && state.profile.display_name) || meta.full_name || meta.name || appleName || '';
      if (ref && !$('heard').value) { prefillHeard = { heard: 'friend', inviter: '@' + ref }; }
      logFunnel('profile_started');
      return loadLists().then(render);
    });
  }

  // ---------- step 2: profile ----------
  var listsLoaded = null;
  function loadLists() {
    if (listsLoaded) return listsLoaded;
    var mine = state.user ? ',requested_by.eq.' + state.user.id : '';
    listsLoaded = Promise.all([
      sb.get('regions?select=name,name_ar&country_code=eq.EG&enabled=eq.true&order=sort,name'),
      sb.get('communities?select=id,name,kind,governorate,country_code,status&or=(status.eq.approved' + mine + ')&order=name')
    ]).then(function (res) {
      if (res[0].error || res[1].error) throw new Error('load');
      state.regions = res[0].data || [];
      state.communities = (res[1].data || []).filter(function (c) { return c.status !== 'rejected' && (c.country_code || 'EG') === 'EG'; });
    }).catch(function () { listsLoaded = null; fail('errLoad'); });
    return listsLoaded;
  }
  function communityLabel(c) { return c.status === 'pending' ? c.name + (lang === 'ar' ? ' (مستني المراجعة)' : ' (pending approval)') : c.name; }

  function fillGovernorates() {
    var cur = $('gov').value;
    fillSelect($('gov'), [{ value: '', label: t('choose') }].concat(state.regions.map(function (r) {
      return { value: r.name, label: lang === 'ar' && r.name_ar ? r.name_ar : r.name };
    })), cur);
  }
  function fillAreas() {
    var gov = $('gov').value, cur = $('area').value;
    var areas = state.communities.filter(function (c) { return c.kind === 'area' && c.governorate === gov; });
    var items = gov ? [{ value: '', label: t('choose') }].concat(areas.map(function (a) { return { value: a.id, label: communityLabel(a) }; }), [{ value: OTHER, label: t('notListedArea') }])
                    : [{ value: '', label: t('chooseGovFirst') }];
    fillSelect($('area'), items, cur);
    $('area').disabled = !gov;
    $('areaTypedBox').hidden = $('area').value !== OTHER;
  }
  function fillOptional() {
    var box = $('optional'), cur = {};
    box.querySelectorAll('select').forEach(function (s) { cur[s.dataset.kind] = s.value; });
    box.innerHTML = '';
    OPTIONAL.forEach(function (kind) {
      var label = document.createElement('label'); label.className = 'f'; label.htmlFor = 'opt-' + kind; label.textContent = t('optional')[kind];
      var sel = document.createElement('select'); sel.id = 'opt-' + kind; sel.dataset.kind = kind;
      var list = state.communities.filter(function (c) { return c.kind === kind; });
      fillSelect(sel, [{ value: '', label: t('none') }].concat(list.map(function (c) { return { value: c.id, label: communityLabel(c) }; })), cur[kind] || '');
      box.appendChild(label); box.appendChild(sel);
    });
  }
  $('gov').addEventListener('change', function () { $('area').value = ''; fillAreas(); });
  $('area').addEventListener('change', function () { $('areaTypedBox').hidden = $('area').value !== OTHER; });

  var prefillHeard = null;
  function heardDef() { var v = $('heard').value; return HEARD.filter(function (h) { return h.value === v; })[0] || null; }
  function fillHeard() {
    var cur = $('heard').value || (prefillHeard && prefillHeard.heard) || '';
    fillSelect($('heard'), [{ value: '', label: t('preferNot') }].concat(HEARD.map(function (h) { return { value: h.value, label: h[lang] }; })), cur);
    if (prefillHeard) { $('inviter').value = prefillHeard.inviter; prefillHeard = null; }
    var d = heardDef(), pickCur = $('heardPick').value;
    $('heardPickBox').hidden = !(d && d.detail.kind === 'pick');
    $('heardTextBox').hidden = !(d && (d.detail.kind === 'text' || (d.detail.kind === 'pick' && pickCur === OTHER)));
    $('inviterBox').hidden = !(d && d.detail.kind === 'person');
    if (d && d.detail.kind === 'pick') {
      fillSelect($('heardPick'), [{ value: '', label: t('choose') }].concat(d.detail.options.map(function (o) { return { value: o, label: o }; }), [{ value: OTHER, label: t('anotherOne') }]), pickCur);
    }
    $('heardTextLabel').textContent = d && d.detail.kind === 'text' ? d.detail[lang] : t('fWhichOne');
  }
  $('heard').addEventListener('change', function () { $('heardPick').value = ''; $('heardText').value = ''; fillHeard(); });
  $('heardPick').addEventListener('change', fillHeard);

  // Live, advisory username check; the unique index decides on save (same rules as the app).
  function renderUsername() {
    var u = $('username').value, hint = $('usernameHint'), chips = $('usernameChips'), input = $('username');
    chips.innerHTML = ''; hint.classList.remove('bad'); input.classList.remove('ok');
    if (!u) { hint.textContent = t('unEmpty'); return; }
    if (u.length < 3) { hint.textContent = t('unShort'); hint.classList.add('bad'); return; }
    if (state.taken === null) { hint.textContent = t('unChecking'); return; }
    if (state.taken) {
      hint.textContent = t('unTaken')(u); hint.classList.add('bad');
      var yy = new Date().getFullYear() % 100;
      [u + '1', u + '_', u + '.' + yy].filter(function (x) { return x.length <= 20; }).forEach(function (s) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = '@' + s;
        b.addEventListener('click', function () { $('username').value = s; onUsernameInput(); });
        chips.appendChild(b);
      });
      return;
    }
    hint.textContent = t('unOk')(u); input.classList.add('ok');
  }
  function onUsernameInput() {
    var el = $('username'), clean = el.value.toLowerCase().replace(/[^a-z0-9._]/g, '').slice(0, 20);
    if (clean !== el.value) el.value = clean;
    state.taken = null; renderUsername();
    clearTimeout(state.usernameTimer);
    if (clean.length < 3) return;
    state.usernameTimer = setTimeout(function () {
      sb.rpc('username_available', { candidate: clean }).then(function (res) {
        if ($('username').value !== clean) return;
        state.taken = res.data === false;
        if (state.taken) logFunnel('profile_field_error', { field: 'username_taken' });
        renderUsername();
      });
    }, 400);
  }
  $('username').addEventListener('input', onUsernameInput);

  $('loves').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    state.loves = b.dataset.loves;
    document.querySelectorAll('#loves button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
  });

  // Egyptian mobile: 01x + 8 digits, written with or without the 0, +20 or 0020; Arabic digits allowed.
  function normalizePhone(raw) {
    var d = raw.replace(/[٠-٩]/g, function (c) { return String(c.charCodeAt(0) - 0x0660); })
               .replace(/[۰-۹]/g, function (c) { return String(c.charCodeAt(0) - 0x06f0); })
               .replace(/\D/g, '');
    if (d.indexOf('0020') === 0) d = d.slice(4); else if (d.indexOf('20') === 0 && d.length === 12) d = d.slice(2);
    if (d.charAt(0) === '0') d = d.slice(1);
    return /^1[0125]\d{8}$/.test(d) ? '+20' + d : null;
  }

  function fail(k, boxId) { var e = $(boxId || 'err'); e.textContent = t(k); e.classList.add('show'); }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    $('err').classList.remove('show');
    var name = $('name').value.trim(), username = $('username').value, whatsapp = normalizePhone($('whatsapp').value);
    var gov = $('gov').value, areaId = $('area').value, typed = $('areaTyped').value.trim();
    if (!name) return fail('errName');
    if (username.length < 3 || state.taken !== false) return fail('errUsername');
    if (!whatsapp) return fail('errPhone');
    if (!state.loves) return fail('errLoves');
    if (!gov) return fail('errGov');
    if (!areaId || (areaId === OTHER && typed.length < 2)) return fail('errArea');
    if (!$('consent').checked) return fail('errConsent');

    var d = heardDef(), pick = $('heardPick').value, text = $('heardText').value.trim();
    var heardDetail = !d ? null : d.detail.kind === 'pick' ? (pick && pick !== OTHER ? pick : text || null) : d.detail.kind === 'text' ? text || null : null;
    var uid = state.user.id, btn = $('submit');
    btn.disabled = true; btn.textContent = t('sending');

    // A typed area is sent as a community request; the database adds the member when an admin approves.
    var areaStep = areaId !== OTHER ? Promise.resolve(state.communities.filter(function (c) { return c.id === areaId; })[0]) :
      sb.insertOne('communities', { name: typed, kind: 'area', governorate: gov, area: typed, requested_by: uid, status: 'pending', country_code: 'EG' },
        'id,name,kind,governorate,status').then(function (res) {
          if (res.error && res.error.code === '23505') throw { msg: 'errAreaExists' };
          if (res.error) throw res.error;
          state.communities.push(res.data);
          logFunnel('community_requested', { kind: 'area', country: 'EG' });
          return res.data;
        });

    areaStep.then(function (area) {
      return sb.update('profiles', 'id=eq.' + uid, {
        display_name: name, username: username, loves: state.loves, country_code: 'EG', governorate: gov, area: area.name,
        instapay_handle: $('instapay').value.trim() || null,
        heard_from: d ? d.value : null, heard_detail: heardDetail,
        inviter_name: d && d.detail.kind === 'person' ? $('inviter').value.trim() || null : null,
        whatsapp: whatsapp, signup_source: source, lang: lang
      }).then(function (res) {
        if (res.error && res.error.code === '23505') { state.taken = true; renderUsername(); logFunnel('identifier_conflict', { type: 'username' }); throw { msg: 'errUsername' }; }
        if (res.error) throw res.error;
        var ids = [area].concat(OPTIONAL.map(function (k) { var v = $('opt-' + k).value; return state.communities.filter(function (c) { return c.id === v; })[0]; }))
          .filter(function (c) { return c && c.status === 'approved'; }).map(function (c) { return c.id; });
        logFunnel('communities_selected', { count: ids.length });
        return ids.length ? sb.insert('community_members', ids.map(function (id) { return { community_id: id, user_id: uid }; }), true) : null;
      });
    }).then(function () {
      logFunnel('signup_completed', { heard_from: d ? d.value : null });
      if (window.fbq) window.fbq('track', 'CompleteRegistration');
      return sb.rpc('my_profile');
    }).then(function (res) {
      state.profile = res.data; state.step = 'done'; render();
      $('stepDone').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }).catch(function (err) {
      fail(err && err.msg ? err.msg : 'errNet');
    }).then(function () { btn.disabled = false; btn.textContent = t('submit'); });
  });

  // ---------- step 3: done ----------
  // Always the public address, even when the page is opened on a preview link.
  function inviteLink() { return (CFG.siteUrl || location.origin + '/') + '?ref=' + encodeURIComponent(state.profile.username); }
  // WhatsApp with the message ready to send: the app on phones, WhatsApp Web on a computer.
  $('share').addEventListener('click', function () {
    var url = 'https://wa.me/?text=' + encodeURIComponent(t('shareText') + ' ' + inviteLink());
    var w = window.open(url, '_blank');
    if (w) w.opener = null; else location.href = url;
  });
  $('copy').addEventListener('click', function () {
    var b = $('copy');
    function ok() { b.textContent = t('copied'); setTimeout(function () { b.textContent = t('copy'); }, 2000); }
    if (navigator.clipboard) navigator.clipboard.writeText(inviteLink()).then(ok, function () { prompt('', inviteLink()); });
    else prompt('', inviteLink());
  });
  document.querySelectorAll('[data-signout]').forEach(function (b) {
    b.addEventListener('click', function () {
      sb.auth.signOut().then(function () { state.user = null; state.profile = null; state.step = 'start'; render(); });
    });
  });

  // Meta pixel, only when the ads account gives us an ID (config.js).
  if (CFG.metaPixelId) {
    /* eslint-disable */
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    window.fbq('init', CFG.metaPixelId); window.fbq('track', 'PageView');
  }

  render();
  logFunnel('welcome_viewed', { lang: lang });
  // Coming back on the same browser: carry on where they left off.
  sb.auth.getSession().then(function (res) {
    var s = res.data && res.data.session;
    if (s) afterSignIn(s.user);
  });
})();
</script>
</body>
</html>
