# Builds a new iPhone app (needed only when something native changes). Start it from the Actions tab.
# "preview" is the test build; "production" is the build you upload to the App Store.
name: Build iPhone app
on:
  workflow_dispatch:
    inputs:
      profile:
        description: preview = test build, production = build for the App Store
        type: choice
        options:
          - preview
          - production
        default: preview
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      # Lets Expo create and validate the Apple certificate and provisioning profile without a Mac terminal.
      # Needs two GitHub secrets: ASC_API_KEY_P8 (contents of the .p8 file) and ASC_KEY_ID.
      - name: Apple API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -n "$ASC_API_KEY_P8" ] && [ -n "$ASC_KEY_ID" ]; then
            printf '%s\n' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            echo "EXPO_ASC_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "EXPO_ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
            echo "EXPO_ASC_ISSUER_ID=0f3d6df9-773e-49f9-93ba-57dc94dcc7ba" >> "$GITHUB_ENV"
          fi
      - run: eas build --platform ios --profile ${{ inputs.profile }} --non-interactive --no-wait
