# Sends the newest tested update to REAL users (channel "production"), to a share of them first.
# Only the repository owner can start it, from the Actions tab: "Promote update" > "Run workflow".
name: Promote update
on:
  workflow_dispatch:
    inputs:
      percentage:
        description: Share of real users who get it now (1-100). 100 sends it to everyone. Or use a small number first, then run again with 100.
        default: '10'
        required: true
jobs:
  promote:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      # EAS reads the app config, which needs the installed packages (the first run failed without this).
      - run: npm ci
      - name: Make sure the real-user branch and channel exist
        run: |
          eas branch:create production --non-interactive || true
          eas channel:edit production --branch production --non-interactive || true
      - name: Find the newest tested update
        id: latest
        run: |
          eas update:list --branch preview --limit 1 --json --non-interactive > latest.json
          GROUP=$(jq -r '.currentPage[0].group // empty' latest.json)
          if [ -z "$GROUP" ]; then echo "No tested update found"; cat latest.json; exit 1; fi
          echo "group=$GROUP" >> "$GITHUB_OUTPUT"
      # EAS allows one rollout at a time per branch. If an earlier run left one at a small share (the first run of a
      # "small number first" pair), finish it at 100% so the next promotion can start (run #3 and #4 failed on this).
      - name: Finish an earlier rollout, if one is still in progress
        run: |
          eas update:list --branch production --limit 1 --json --non-interactive > production.json || true
          ACTIVE=$(jq -r '.currentPage[0].group // empty' production.json 2>/dev/null || true)
          if [ -n "$ACTIVE" ]; then eas update:edit "$ACTIVE" --rollout-percentage 100 --non-interactive || true; fi
      # EAS refuses a rollout percentage of 100 (it accepts 0 to 99): "everyone" is a normal republish with no percentage.
      - name: Send it to real users
        env:
          PERCENT: ${{ inputs.percentage }}
          GROUP: ${{ steps.latest.outputs.group }}
        run: |
          if [ "$PERCENT" -ge 100 ]; then
            eas update:republish --group "$GROUP" --destination-branch production --force-end-active-rollout --message "Promoted from test" --non-interactive
          else
            eas update:republish --group "$GROUP" --destination-branch production --rollout-percentage "$PERCENT" --force-end-active-rollout --message "Promoted from test" --non-interactive
          fi
